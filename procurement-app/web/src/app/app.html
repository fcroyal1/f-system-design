<div class="shell">
  <header class="topbar">
    <a class="brand" routerLink="/">
      <svg class="brand-mark" viewBox="0 0 24 24" aria-hidden="true">
        <defs>
          <linearGradient id="brand-grad" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#2f7fe0" />
            <stop offset="1" stop-color="#0b4a8f" />
          </linearGradient>
        </defs>
        <rect width="24" height="24" rx="6" fill="url(#brand-grad)" />
        <path d="M7 8h10M7 12h10M7 16h6" />
      </svg>
      <span>Procurement</span>
    </a>
    <div class="topbar-end">
      <span class="env">Demo data</span>
      <button
        type="button"
        class="icon-button"
        (click)="theme.toggle()"
        [attr.aria-label]="theme.theme() === 'dark' ? 'Switch to light theme' : 'Switch to dark theme'"
        [attr.title]="theme.theme() === 'dark' ? 'Light theme' : 'Dark theme'"
      >
        <app-icon [name]="theme.theme() === 'dark' ? 'sun' : 'moon'" [size]="18" />
      </button>
      <span class="user">
        <span class="avatar" aria-hidden="true">DU</span>
        <span class="user-name">Demo User</span>
      </span>
    </div>
  </header>

  <aside class="sidebar">
    <nav aria-label="Main">
      <ul>
        @for (link of links; track link.path) {
          <li>
            <a
              [routerLink]="link.path"
              routerLinkActive="active"
              [routerLinkActiveOptions]="{ exact: link.exact }"
              ariaCurrentWhenActive="page"
            >
              <app-icon [name]="link.icon" />
              <span>{{ link.label }}</span>
            </a>
          </li>
        }
      </ul>
      <ul class="nav-end">
        <li>
          <a [routerLink]="helpLink.path" routerLinkActive="active" ariaCurrentWhenActive="page">
            <app-icon [name]="helpLink.icon" />
            <span>{{ helpLink.label }}</span>
          </a>
        </li>
      </ul>
    </nav>
  </aside>

  <main class="content">
    <router-outlet />
  </main>
</div>
