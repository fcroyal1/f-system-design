<div class="shell">
  <aside class="sidebar">
    <a class="brand" routerLink="/">Procurement</a>
    <nav aria-label="Main">
      <ul>
        @for (link of links; track link.path) {
          <li>
            <a
              [routerLink]="link.path"
              routerLinkActive="active"
              [routerLinkActiveOptions]="{ exact: link.exact }"
              ariaCurrentWhenActive="page"
              >{{ link.label }}</a
            >
          </li>
        }
      </ul>
    </nav>
  </aside>
  <main class="content">
    <router-outlet />
  </main>
</div>
